<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SostaApp — Your highway stop planner</title>
<style>
  :root {
    --bg: #f2f6f3;
    --surface: #ffffff;
    --ink: #12261d;
    --muted: #5d7167;
    --line: #d9e3dd;
    --green: #0a6c4b;
    --green-dark: #07523a;
    --signal: #f5c400;
    --danger: #b3261e;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1713;
      --surface: #15231c;
      --ink: #eaf3ee;
      --muted: #93a99d;
      --line: #264033;
      --green: #2fb585;
      --green-dark: #52cc9f;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    line-height: 1.5;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

  /* Header: styled like a motorway sign */
  header {
    background: #0a6c4b;
    color: #fff;
    padding: 10px 20px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 4px solid var(--signal);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: #fff; color: #0a6c4b;
    display: grid; place-items: center;
    font-weight: 800; font-size: 1.2rem;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff;
    padding: 6px 12px; border-radius: 999px;
    font-size: .88rem; cursor: pointer;
  }
  .user-chip:hover { background: rgba(255,255,255,.24); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); }
  .dot.in { background: #6df0b5; }
  .btn-ghost {
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,.45);
    padding: 6px 12px; border-radius: 999px;
    font-size: .88rem; cursor: pointer;
    text-decoration: none;
  }
  .btn-ghost:hover { background: rgba(255,255,255,.18); }

  /* Main */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; }
  .thread {
    flex: 1; width: 100%; max-width: 760px;
    overflow-y: auto; padding: 24px 16px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .welcome { margin: auto 0; padding: 12px 0 24px; }
  .welcome h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2; margin-bottom: 8px; }
  .welcome p { color: var(--muted); max-width: 52ch; margin-bottom: 22px; }
  .starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .starter {
    text-align: left; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer;
  }
  .starter:hover { border-color: var(--green); }
  .starter b { display: block; margin-bottom: 2px; }
  .starter span { color: var(--muted); font-size: .86rem; }

  .msg { max-width: 86%; padding: 11px 15px; border-radius: var(--radius); font-size: .97rem; }
  .msg.user { align-self: flex-end; background: var(--green); color: #fff; border-bottom-right-radius: 4px; }
  @media (prefers-color-scheme: dark) { .msg.user { color: #06241a; } }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.error { border-color: var(--danger); color: var(--danger); }
  .md p { margin-bottom: 8px; }
  .md p:last-child { margin-bottom: 0; }
  .md ul, .md ol { margin: 4px 0 8px 20px; }
  .md li { margin-bottom: 3px; }
  .md code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .tools { margin-top: 8px; display: none; }
  body.dev .tools { display: block; }
  .tool-pill {
    display: inline-block; margin: 0 6px 4px 0; padding: 2px 8px; font-size: .74rem;
    border: 1px solid var(--line); border-radius: 6px; color: var(--muted);
    font-family: ui-monospace, Menlo, monospace;
  }

  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .7; } }

  .toast {
    align-self: center; background: var(--surface); border: 1px solid var(--green);
    color: var(--green-dark); padding: 8px 14px; border-radius: 999px; font-size: .86rem; font-weight: 600;
  }

  /* Composer */
  .composer-wrap {
    width: 100%; max-width: 760px;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .quick button {
    white-space: nowrap; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: .84rem; cursor: pointer; color: var(--muted);
  }
  .quick button:hover { border-color: var(--green); color: var(--ink); }
  .composer {
    display: flex; gap: 8px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 18px;
  }
  .composer:focus-within { border-color: var(--green); }
  .composer input { flex: 1; border: none; background: transparent; outline: none; min-width: 0; }
  .send {
    background: var(--green); color: #fff; border: none; border-radius: 999px;
    padding: 9px 20px; font-weight: 600; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .send { color: #06241a; } }
  .send:hover { background: var(--green-dark); }
  .send:disabled { opacity: .5; cursor: not-allowed; }

  /* Dialog */
  dialog {
    margin: auto; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); padding: 22px; width: min(420px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { font-size: 1.15rem; margin-bottom: 6px; }
  dialog p { color: var(--muted); font-size: .9rem; margin-bottom: 14px; }
  dialog input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); margin-bottom: 14px;
  }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #06241a; } }
  .menu-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .menu-list .btn { text-align: left; }

  /* Developer drawer (hidden unless turned on) */
  .dev-panel {
    display: none; border-top: 1px solid var(--line); background: var(--surface);
    width: 100%; max-height: 32vh; overflow: auto; padding: 10px 16px; font-size: .78rem;
  }
  body.dev .dev-panel { display: block; }
  .dev-panel h3 { font-size: .82rem; margin: 6px 0 4px; color: var(--muted); }
  .dev-panel pre { font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true">P</span><span>SostaApp</span></div>
  <div class="header-actions">
    <a class="btn-ghost" href="/dev-ui/guide">Guide</a>
    <button class="btn-ghost" id="newChatBtn">New chat</button>
    <button class="user-chip" id="userChip" aria-haspopup="dialog"><span class="dot" id="userDot"></span><span id="userLabel">Guest</span></button>
  </div>
</header>

<main>
  <div class="thread" id="thread" aria-live="polite">
    <section class="welcome" id="welcome">
      <h1>Where are you headed today?</h1>
      <p>Tell me your route and what you need. I will find the right highway stops for your food, fuel or charging, and any four-legged passengers.</p>
      <div class="starters">
        <button class="starter" data-prompt="Hi! I am new here and would like to create a profile."><b>Create my profile</b><span>Save your tastes and your car</span></button>
        <button class="starter" data-prompt="Hi! I am a registered user."><b>I am a registered user</b><span>Sign in with your User ID</span></button>
      </div>
    </section>
  </div>

  <div class="composer-wrap">
    <form class="composer" id="composer">
      <input type="text" id="msgInput" placeholder="Ask about your route, food or a stop…" autocomplete="off" aria-label="Your message" />
      <button type="submit" class="send" id="sendBtn">Send</button>
    </form>
  </div>

  <div class="dev-panel" id="devPanel">
    <h3 id="devHealth">Service status</h3>
    <h3>Session state</h3><pre id="stateBox">{}</pre>
    <h3>Last turn tool calls</h3><pre id="toolsBox">[]</pre>
  </div>
</main>

<dialog id="accountDialog">
  <h2 id="dlgTitle">Your account</h2>
  <p id="dlgText"></p>
  <div id="signInBlock">
    <input type="text" id="idInput" placeholder="Your ID, for example usr_0a8f67" aria-label="Your ID" autocomplete="off" />
  </div>
  <div class="menu-list">
    <button class="btn" id="signOutBtn">Sign out and continue as guest</button>
    <button class="btn" id="devToggleBtn">Show developer details</button>
    <a class="btn" href="/dev-ui/guide">Architecture &amp; features guide</a>
  </div>
  <div class="row">
    <button class="btn" id="dlgCancel">Close</button>
    <button class="btn primary" id="dlgSave">Sign in</button>
  </div>
</dialog>

<script>
const APP_NAME = 'sosta_app';
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const newSessionId = () => 'chat_' + Date.now().toString(36) + Math.floor(Math.random() * 1000);

let userId = store.get('sosta_user', 'guest');
let sessionId = store.get('sosta_session', '') || newSessionId();
store.set('sosta_session', sessionId);
if (new URLSearchParams(location.search).get('debug') === '1') document.body.classList.add('dev');

/* ---------- Rendering ---------- */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function inline(l) {
  let o = esc(l);
  o = o.replace(/`([^`]+)`/g, '<code>$1</code>');
  o = o.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return o.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
}
function markdown(text) {
  let html = '', ul = false, ol = false;
  const close = () => { if (ul) html += '</ul>'; if (ol) html += '</ol>'; ul = ol = false; };
  for (const raw of String(text || '').split('\n')) {
    const t = raw.trim();
    if (!t) { close(); continue; }
    const u = t.match(/^([*\-•])\s+(.*)$/), o = t.match(/^(\d+)\.\s+(.*)$/);
    if (u) { if (ol) { html += '</ol>'; ol = false; } if (!ul) { html += '<ul>'; ul = true; } html += '<li>' + inline(u[2]) + '</li>'; }
    else if (o) { if (ul) { html += '</ul>'; ul = false; } if (!ol) { html += '<ol>'; ol = true; } html += '<li>' + inline(o[2]) + '</li>'; }
    else { close(); html += '<p>' + inline(t) + '</p>'; }
  }
  close();
  return html;
}
function scrollDown() { const t = $('thread'); t.scrollTop = t.scrollHeight; }
function hideWelcome() { const w = $('welcome'); if (w) w.style.display = 'none'; }
function showWelcome() { const w = $('welcome'); if (w) w.style.display = ''; }

function addMessage(role, text, tools, extraClass) {
  hideWelcome();
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (extraClass ? ' ' + extraClass : '');
  const body = document.createElement('div');
  body.className = 'md';
  body.innerHTML = markdown(text);
  div.appendChild(body);
  if (tools && tools.length) {
    const box = document.createElement('div');
    box.className = 'tools';
    tools.forEach(tc => { const p = document.createElement('span'); p.className = 'tool-pill'; p.textContent = tc.author + ': ' + tc.name + '()'; box.appendChild(p); });
    div.appendChild(box);
  }
  $('thread').appendChild(div);
  scrollDown();
  return div;
}
function addToast(text) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = text;
  $('thread').appendChild(d);
  scrollDown();
}
function addTyping() {
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.setAttribute('aria-label', 'SostaApp is typing');
  d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  $('thread').appendChild(d);
  scrollDown();
  return d;
}

function refreshUser() {
  const signedIn = userId !== 'guest';
  $('userLabel').textContent = signedIn ? 'Signed in · ' + userId : 'Guest · Sign in';
  $('userDot').className = 'dot' + (signedIn ? ' in' : '');
}

/* ---------- Session ---------- */
function eventsToMessages(events) {
  const out = []; let pending = [];
  for (const ev of (events || [])) {
    const parts = (ev.content && ev.content.parts) || [];
    for (const p of parts) {
      const fc = p.functionCall || p.function_call;
      if (fc) pending.push({ author: ev.author || 'agent', name: fc.name });
    }
    const texts = parts.filter(p => p.text).map(p => p.text);
    if (texts.length) {
      const isUser = ev.author === 'user';
      const cleaned = isUser ? texts.join('\n').replace(/^\[Signed-in User ID:\s*[^\]]+\]\s*/i, '') : texts.join('\n');
      out.push({ role: isUser ? 'user' : 'bot', text: cleaned, tools: isUser ? [] : pending });
      if (!isUser) pending = [];
    }
  }
  return out;
}
async function loadSession() {
  try {
    const res = await fetch(`/apps/${APP_NAME}/users/${encodeURIComponent(userId)}/sessions/${encodeURIComponent(sessionId)}`);
    if (!res.ok) { $('stateBox').textContent = '{}'; return; }
    const s = await res.json();
    $('stateBox').textContent = JSON.stringify(s.state || {}, null, 2);
    if (s.state && s.state.verified_user_id && s.state.verified_user_id !== userId) {
      setUser(s.state.verified_user_id);
    }
    const msgs = eventsToMessages(s.events);
    if (msgs.length) {
      document.querySelectorAll('#thread .msg, #thread .toast').forEach(n => n.remove());
      msgs.forEach(m => addMessage(m.role, m.text, m.tools));
    }
  } catch (e) { console.error(e); }
}
function startNewChat() {
  sessionId = newSessionId();
  store.set('sosta_session', sessionId);
  document.querySelectorAll('#thread .msg, #thread .toast').forEach(n => n.remove());
  $('stateBox').textContent = '{}';
  $('toolsBox').textContent = '[]';
  showWelcome();
  $('msgInput').focus();
}
function setUser(id) {
  userId = id || 'guest';
  userId === 'guest' ? store.del('sosta_user') : store.set('sosta_user', userId);
  refreshUser();
}

/* ---------- Sending ---------- */
async function send(text) {
  text = (text || '').trim();
  if (!text) return;
  const prevUser = userId;
  $('msgInput').value = '';
  addMessage('user', text);
  const btn = $('sendBtn'); btn.disabled = true;
  const typing = addTyping();
  try {
    const res = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        app_name: APP_NAME, user_id: prevUser, session_id: sessionId,
        new_message: { role: 'user', parts: [{ text }] }, streaming: false
      })
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const events = await res.json();
    let tools = [], reply = '', detected = null;
    for (const ev of (Array.isArray(events) ? events : [])) {
      const delta = (ev.actions && (ev.actions.stateDelta || ev.actions.state_delta)) || {};
      if (delta.verified_user_id) detected = delta.verified_user_id;
      const parts = (ev.content && ev.content.parts) || [];
      for (const p of parts) {
        const fc = p.functionCall || p.function_call;
        if (fc) tools.push({ author: ev.author || 'agent', name: fc.name, args: fc.args || {} });
      }
      const texts = parts.filter(p => p.text).map(p => p.text);
      if (texts.length && ev.author !== 'user') reply = texts.join('\n');
    }
    typing.remove();
    addMessage('bot', reply || 'I did not get a reply. Please try again.', tools);
    $('toolsBox').textContent = JSON.stringify(tools, null, 2);

    if (detected && detected !== prevUser) {
      setUser(detected);
      addToast("You're signed in as " + detected + ". Your preferences are saved to this account.");
    }
    // Save this conversation to long-term memory so the assistant remembers you next time
    fetch(`/apps/${APP_NAME}/users/${encodeURIComponent(userId)}/memory`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    }).catch(() => {});
    const st = await fetch(`/apps/${APP_NAME}/users/${encodeURIComponent(userId)}/sessions/${encodeURIComponent(sessionId)}`);
    if (st.ok) $('stateBox').textContent = JSON.stringify((await st.json()).state || {}, null, 2);
  } catch (err) {
    typing.remove();
    addMessage('bot', 'Something went wrong and your message was not sent. Check your connection and try again.', null, 'error');
    console.error(err);
  } finally {
    btn.disabled = false;
    $('msgInput').focus();
  }
}

/* ---------- Events ---------- */
$('composer').addEventListener('submit', (e) => { e.preventDefault(); send($('msgInput').value); });
document.querySelectorAll('[data-prompt]').forEach(b => b.addEventListener('click', () => send(b.dataset.prompt)));
$('newChatBtn').addEventListener('click', startNewChat);

const dlg = $('accountDialog');
function openAccount() {
  const signedIn = userId !== 'guest';
  $('dlgTitle').textContent = signedIn ? 'Your account' : 'Sign in';
  $('dlgText').textContent = signedIn
    ? 'You are signed in as ' + userId + '. Your preferences and past trips are remembered.'
    : 'Enter your ID to bring back your profile and past trips. New here? Close this and choose “Create my profile”.';
  $('signInBlock').style.display = signedIn ? 'none' : '';
  $('dlgSave').style.display = signedIn ? 'none' : '';
  $('signOutBtn').style.display = signedIn ? '' : 'none';
  $('devToggleBtn').textContent = document.body.classList.contains('dev') ? 'Hide developer details' : 'Show developer details';
  dlg.showModal();
}
$('userChip').addEventListener('click', openAccount);
$('dlgCancel').addEventListener('click', () => dlg.close());
$('dlgSave').addEventListener('click', () => {
  const id = $('idInput').value.trim();
  if (!id) { $('idInput').focus(); return; }
  setUser(id); dlg.close(); startNewChat();
  addToast('Welcome back! I have loaded your profile.');
});
$('signOutBtn').addEventListener('click', () => { setUser('guest'); dlg.close(); startNewChat(); });
$('devToggleBtn').addEventListener('click', () => { document.body.classList.toggle('dev'); dlg.close(); });

async function checkHealth() {
  try {
    const d = await (await fetch('/health')).json();
    $('devHealth').textContent = `Service status: online (${d.session_service} + ${d.memory_service} · ${d.session_db})`;
  } catch (e) { $('devHealth').textContent = 'Service status: offline'; }
}

refreshUser();
checkHealth();
loadSession();
</script>
</body>
</html>
